
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Immaginai - Create AI images from text">
    <meta name="theme-color" content="#ffffff">
    <title>Immaginai</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            background: #fff;
            color: #171717;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        .app {
            text-align: center;
        }

        .app img {
            display: block;
            width: 160px;
            max-width: 100%;
            height: auto;
            margin: 0 auto 28px;
            border-radius: 20px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.04em;
        }

        .app p {
            margin: 0;
            font-size: 1rem;
            line-height: 1.6;
            color: #737373;
        }

        footer {
            padding: 24px;
            text-align: center;
            font-size: 0.85rem;
        }

        footer a {
            color: #888;
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #171717;
        }
    </style>
</head>

<body>
    <main>
        <section class="app" aria-labelledby="app-title">
            <img
                src="images/nrelogosshadow.jpg"
                alt="Immaginai app icon"
                width="160"
                height="160"
            >

            <h1 id="app-title">Immaginai</h1>
            <p>Create any AI image from text.</p>

    </main>

    <footer>
        <a href="mailto:info@info.com">info@latentlake.com</a>
    </footer>
</body>
</html>
